<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Frequência Escolar</title>

<style>
:root{
    --azul:#2563eb;
    --azul-hover:#1d4ed8;
    --verde:#16a34a;
    --vermelho:#dc2626;
    --cinza:#e5e7eb;
    --fundo:#f8fafc;
}

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:var(--fundo);
}

header{
    background:var(--azul);
    color:white;
    padding:15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:99;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.tab{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:white;
}

.tab.active{
    background:var(--azul);
    color:white;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
}

button{
    cursor:pointer;
}

.btn{
    background:var(--azul);
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
}

.btn:hover{
    background:var(--azul-hover);
}

.btn-danger{
    background:var(--vermelho);
}

.btn-success{
    background:var(--verde);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#f1f5f9;
}

.student{
    padding:8px;
    border-bottom:1px solid #ddd;
}

.flex{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.small{
    width:auto;
}
</style>
</head>

<body>

<header>
<h1>Controle de Frequência Escolar</h1>
</header>

<div class="container">

<div class="card">
<label>Turma Ativa</label>
<select id="turmaAtiva"></select>
</div>

<div class="tabs">
<button class="tab active" onclick="mostrarAba('turmas',this)">
Turmas
</button>

<button class="tab" onclick="mostrarAba('trimestres',this)">
Trimestres
</button>

<button class="tab" onclick="mostrarAba('faltas',this)">
Faltas
</button>

<button class="tab" onclick="mostrarAba('consolidado',this)">
Consolidado
</button>

<button class="tab" onclick="mostrarAba('backup',this)">
Backup
</button>
</div>

<!-- TURMAS -->

<div id="turmas" class="section active">

<div class="card">
<h2>Nova Turma</h2>

<input id="nomeTurma" placeholder="Nome da turma">

<button class="btn" onclick="criarTurma()">
Criar Turma
</button>
</div>

<div class="card">
<h2>Importar alunos TXT</h2>

<input type="file" id="txtAlunos" accept=".txt">

<button class="btn btn-success" onclick="importarTXT()">
Importar
</button>

<p>
Um aluno por linha.
</p>
</div>

<div class="card">
<h2>Alunos da Turma</h2>

<div id="listaAlunos"></div>

</div>

</div>

<!-- TRIMESTRES -->

<div id="trimestres" class="section">

<div class="card">

<h2>Novo Trimestre</h2>

<input id="nomeTri"
placeholder="Ex.: 1º Trimestre">

<input id="mesesTri"
placeholder="Ex.: Fevereiro, Março, Abril, Maio">

<button class="btn"
onclick="criarTrimestre()">

Criar Trimestre

</button>

</div>

<div class="card">

<h2>Trimestres Cadastrados</h2>

<div id="listaTrimestres"></div>

</div>

</div>

<!-- FALTAS -->

<div id="faltas" class="section">

<div class="card">

<label>Trimestre</label>

<select id="trimestreSelecionado"
onchange="renderFaltas()">

</select>

</div>

<div id="areaFaltas"></div>

</div>

<!-- CONSOLIDADO -->

<div id="consolidado" class="section">

<div class="card">

<label>Trimestre</label>

<select id="trimestreConsolidado"
onchange="renderConsolidado()">
</select>

</div>

<div id="tabelaConsolidado"></div>

</div>

<!-- BACKUP -->

<div id="backup" class="section">

<div class="card">

<h2>Backup</h2>

<button class="btn btn-success"
onclick="exportarBackup()">

Exportar JSON

</button>

<hr>

<input type="file"
id="arquivoBackup"
accept=".json">

<button class="btn"
onclick="importarBackup()">

Restaurar Backup

</button>

</div>

</div>

</div>

<script>

let dados = JSON.parse(
localStorage.getItem("frequencia-escolar")
) || {

turmas:[],
trimestres:[]

};

function salvar(){
localStorage.setItem(
"frequencia-escolar",
JSON.stringify(dados)
);
}

function mostrarAba(id,botao){

document.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

botao.classList.add("active");
}

function criarTurma(){

let nome =
document.getElementById("nomeTurma").value.trim();

if(!nome) return;

dados.turmas.push({

id:Date.now(),
nome,
alunos:[]

});

salvar();
renderTudo();

document.getElementById("nomeTurma").value="";

}

function criarTrimestre(){

let nome =
document.getElementById("nomeTri").value.trim();

let meses =
document.getElementById("mesesTri")
.value
.split(",")
.map(m=>m.trim())
.filter(Boolean);

if(!nome || meses.length===0)
return;

dados.trimestres.push({

id:Date.now(),
nome,
meses

});

salvar();
renderTudo();

document.getElementById("nomeTri").value="";
document.getElementById("mesesTri").value="";

}

function turmaAtual(){

let id =
Number(
document.getElementById("turmaAtiva").value
);

return dados.turmas.find(
t=>t.id===id
);

}

function importarTXT(){

const turma = turmaAtual();

if(!turma){
alert("Selecione uma turma");
return;
}

const arquivo =
document.getElementById("txtAlunos").files[0];

if(!arquivo){
alert("Selecione um arquivo");
return;
}

const reader = new FileReader();

reader.onload = e=>{

const linhas =
e.target.result
.split(/\r?\n/)
.map(x=>x.trim())
.filter(Boolean);

linhas.forEach(nome=>{

turma.alunos.push({

id:Date.now()+Math.random(),
nome,
faltas:{}

});

});

salvar();
renderTudo();

};

reader.readAsText(arquivo);

}

function renderTurmas(){

let select =
document.getElementById("turmaAtiva");

select.innerHTML =
'<option value="">Selecione</option>';

dados.turmas.forEach(t=>{

select.innerHTML +=

`<option value="${t.id}">
${t.nome}
</option>`;

});

if(dados.turmas.length){

select.value =
dados.turmas[0].id;

}

renderAlunos();

}

function renderAlunos(){

let turma = turmaAtual();

let div =
document.getElementById("listaAlunos");

if(!turma){

div.innerHTML =
"Nenhuma turma selecionada";

return;
}

div.innerHTML="";

turma.alunos.forEach(aluno=>{

div.innerHTML +=

`<div class="student">

${aluno.nome}

</div>`;

});

}

document
.getElementById("turmaAtiva")
.addEventListener(
"change",
()=>{
renderAlunos();
renderFaltas();
renderConsolidado();
}
);

function renderTrimestres(){

let html="";

dados.trimestres.forEach(t=>{

html += `

<div style="padding:10px;border-bottom:1px solid #ddd">

<strong>${t.nome}</strong><br>

${t.meses.join(", ")}

</div>

`;

});

document.getElementById(
"listaTrimestres"
).innerHTML = html;

let selects = [
document.getElementById(
"trimestreSelecionado"
),
document.getElementById(
"trimestreConsolidado"
)
];

selects.forEach(s=>{

s.innerHTML="";

dados.trimestres.forEach(t=>{

s.innerHTML +=

`<option value="${t.id}">
${t.nome}
</option>`;

});

});

}

function renderFaltas(){

const turma = turmaAtual();

const triId =
Number(
document.getElementById(
"trimestreSelecionado"
).value
);

const trimestre =
dados.trimestres.find(
t=>t.id===triId
);

if(!turma || !trimestre) return;

let html =
'<div class="card">';

html += '<table>';

html += '<tr><th>Aluno</th>';

trimestre.meses.forEach(m=>{

html+=`<th>${m}</th>`;

});

html+='</tr>';

turma.alunos.forEach(aluno=>{

html += `<tr><td>${aluno.nome}</td>`;

trimestre.meses.forEach(m=>{

let valor =
aluno.faltas[m]||0;

html +=

`<td>

<input
type="number"
min="0"
value="${valor}"

onchange="
atualizarFalta(
'${aluno.id}',
'${m}',
this.value
)
">

</td>`;

});

html += '</tr>';

});

html += '</table></div>';

document.getElementById(
"areaFaltas"
).innerHTML = html;

}

function atualizarFalta(
id,
mes,
valor
){

const turma = turmaAtual();

let aluno =
turma.alunos.find(
a=>a.id==id
);

aluno.faltas[mes] =
Number(valor);

salvar();

renderConsolidado();

}

function renderConsolidado(){

const turma = turmaAtual();

const triId =
Number(
document.getElementById(
"trimestreConsolidado"
).value
);

const trimestre =
dados.trimestres.find(
t=>t.id===triId
);

if(!turma || !trimestre)
return;

let html="<table>";

html+="<tr><th>Aluno</th>";

trimestre.meses.forEach(m=>{

html+=`<th>${m}</th>`;

});

html+="<th>Total</th></tr>";

turma.alunos.forEach(a=>{

let total=0;

html += `<tr><td>${a.nome}</td>`;

trimestre.meses.forEach(m=>{

let v =
a.faltas[m]||0;

total += v;

html += `<td>${v}</td>`;

});

html += `<td><strong>${total}</strong></td>`;

html += "</tr>";

});

html += "</table>";

document.getElementById(
"tabelaConsolidado"
).innerHTML = html;

}

function exportarBackup(){

const blob =
new Blob(
[
JSON.stringify(
dados,
null,
2
)
],
{
type:"application/json"
}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"backup-frequencia.json";

a.click();

}

function importarBackup(){

const arq =
document.getElementById(
"arquivoBackup"
).files[0];

if(!arq) return;

const r = new FileReader();

r.onload = e=>{

dados =
JSON.parse(
e.target.result
);

salvar();
renderTudo();

alert(
"Backup restaurado!"
);

};

r.readAsText(arq);

}

function renderTudo(){

renderTurmas();

renderTrimestres();

setTimeout(()=>{

renderFaltas();

renderConsolidado();

},100);

}

renderTudo();

</script>

</body>
</html>
