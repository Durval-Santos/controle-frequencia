<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Frequência Escolar</title>

<style>

:root{
--primary:#2563eb;
--primary-dark:#1d4ed8;
--success:#16a34a;
--danger:#dc2626;
--bg:#f8fafc;
--card:#ffffff;
--border:#e2e8f0;
--text:#0f172a;
--muted:#64748b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
}

header{
background:var(--primary);
color:white;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:100;
}

.container{
max-width:1300px;
margin:auto;
padding:15px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 4px rgba(0,0,0,.05);
}

.tabs{
display:flex;
gap:5px;
flex-wrap:wrap;
margin-bottom:15px;
}

.tab-btn{
flex:1;
padding:12px;
border:none;
background:white;
border-radius:8px;
font-weight:bold;
cursor:pointer;
border:1px solid var(--border);
}

.tab-btn.active{
background:var(--primary);
color:white;
}

.tab-content{
display:none;
}

.tab-content.active{
display:block;
}

input,
select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border:1px solid var(--border);
border-radius:8px;
}

button{
cursor:pointer;
border:none;
padding:10px 15px;
border-radius:8px;
}

.btn-primary{
background:var(--primary);
color:white;
}

.btn-success{
background:var(--success);
color:white;
}

.btn-danger{
background:var(--danger);
color:white;
}

label{
font-weight:bold;
font-size:.9rem;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{
background:#eff6ff;
}

th,
td{
border:1px solid var(--border);
padding:8px;
text-align:center;
}

.student-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
border-bottom:1px solid var(--border);
}

.badge{
background:#dbeafe;
padding:4px 8px;
border-radius:6px;
font-size:.8rem;
}

.small{
font-size:.85rem;
color:var(--muted);
}

</style>

</head>

<body>

<header>

<h1>
Controle de Frequência Escolar
</h1>

<p>
Turmas • Trimestres • Faltas • Consolidado
</p>

</header>

<div class="container">

<div class="card">

<label>
Turma Ativa
</label>

<select id="turmaAtiva" onchange="trocarTurma()">
</select>

</div>

<div class="tabs">

<button class="tab-btn active"
onclick="abrirAba('turmas',this)">
Turmas
</button>

<button class="tab-btn"
onclick="abrirAba('trimestres',this)">
Trimestres
</button>

<button class="tab-btn"
onclick="abrirAba('faltas',this)">
Faltas
</button>

<button class="tab-btn"
onclick="abrirAba('consolidado',this)">
Consolidado
</button>

<button class="tab-btn"
onclick="abrirAba('backup',this)">
Backup
</button>

</div>

<div
class="tab-content active"
id="turmas">

<div class="card">

<h2>
Nova Turma
</h2>

<input
id="nomeTurma"
placeholder="Ex.: 9º Ano A">

<button
class="btn-primary"
onclick="criarTurma()">

Criar Turma

</button>

<button
class="btn-danger"
onclick="removerTurma()">

Excluir Turma Atual

</button>


</div>

<div class="card">

<h2>
Importar Alunos TXT
</h2>

<p class="small">
Um nome por linha.
</p>

<input
type="file"
accept=".txt"
id="arquivoTxt">

<button
class="btn-success"
onclick="importarTxt()">

Importar

</button>

</div>

<div class="card">

<h2>
Lista de Alunos
</h2>

<div id="listaAlunos">
</div>

</div>

</div>

<div
class="tab-content"
id="trimestres">

<div class="card">

<h2>
Cadastrar Trimestre
</h2>

<input
id="nomeTrimestre"
placeholder="Ex.: 1º Trimestre">

<input
id="mesesTrimestre"
placeholder="Ex.: Fevereiro, Março, Abril, Maio">

<button
class="btn-primary"
onclick="criarTrimestre()">

Cadastrar

</button>

</div>

<div class="card">

<h2>
Trimestres
</h2>

<div id="listaTrimestres">
</div>

</div>

</div>

<div
class="tab-content"
id="faltas">

<div class="card">

<label>
Trimestre
</label>

<select
id="selectTrimestreFaltas"
onchange="renderizarTabelaFaltas()">
</select>

</div>

<div id="areaFaltas">
</div>

</div>

<div
class="tab-content"
id="consolidado">

<div class="card">

<label>
Trimestre
</label>

<select
id="selectTrimestreConsolidado"
onchange="renderizarConsolidado()">
</select>

</div>

<div
id="tabelaConsolidado">
</div>

</div>

<div
class="tab-content"
id="backup">

<div class="card">

<h2>
Backup
</h2>

<button
class="btn-success"
onclick="exportarBackup()">

Exportar JSON

</button>

<hr
style="margin:15px 0;">

<input
type="file"
accept=".json"
id="arquivoBackup">

<button
class="btn-primary"
onclick="importarBackup()">

Restaurar Backup

</button>

</div>

</div>

<script>

let dados =
JSON.parse(
localStorage.getItem(
"controle-frequencia"
)
) || {

turmas:[],

trimestres:[]

};

function salvar(){

localStorage.setItem(
"controle-frequencia",
JSON.stringify(dados)
);

}

function abrirAba(id,btn){

document
.querySelectorAll(
".tab-content"
)
.forEach(x=>{

x.classList.remove(
"active"
);

});

document
.querySelectorAll(
".tab-btn"
)
.forEach(x=>{

x.classList.remove(
"active"
);

});

document
.getElementById(id)
.classList.add(
"active"
);

btn.classList.add(
"active"
);

}

function turmaAtual(){

const id =
Number(
document
.getElementById(
"turmaAtiva"
).value
);

return dados.turmas.find(
t=>t.id===id
);

}

function criarTurma(){

const nome =
document
.getElementById(
"nomeTurma"
)
.value
.trim();

if(!nome){
return;
}

dados.turmas.push({

id:Date.now(),

nome:nome,

alunos:[]

});

salvar();

document
.getElementById(
"nomeTurma"
)
.value="";

renderizarTurmas();

}

function renderizarTurmas(){

const select =
document.getElementById(
"turmaAtiva"
);

select.innerHTML="";

if(
dados.turmas.length===0
){

select.innerHTML =
'<option>Sem turmas</option>';

return;

}

dados.turmas.forEach(
turma=>{

select.innerHTML+=`

<option
value="${turma.id}">

${turma.nome}

</option>

`;

});

renderizarAlunos();

}

function trocarTurma(){

renderizarAlunos();

renderizarTabelaFaltas();

renderizarConsolidado();

}

function removerTurma(){

const turma =
turmaAtual();

if(!turma){
return;
}

if(
!confirm(
"Excluir turma?"
)
){
return;
}

dados.turmas =
dados.turmas.filter(
t => t.id !== turma.id
);

salvar();

renderizarTurmas();

renderizarTabelaFaltas();

renderizarConsolidado();

}

function renderizarAlunos(){

const turma = turmaAtual();

const lista =
document.getElementById(
"listaAlunos"
);

if(!turma){

lista.innerHTML="";
return;

}

let html="";

turma.alunos.forEach(
aluno=>{

html+=`

<div class="student-item">

<span>

${aluno.nome}

</span>

<div>

<button
class="btn-primary"
onclick="editarAluno('${aluno.id}')">

Editar

</button>

<button
class="btn-danger"
onclick="removerAluno('${aluno.id}')">

Excluir

</button>

</div>

</div>

`;

});

lista.innerHTML=html;

}

function editarAluno(id){

const turma =
turmaAtual();

const aluno =
turma.alunos.find(
a=>a.id==id
);

if(!aluno){
return;
}

const novoNome =
prompt(
"Nome do aluno:",
aluno.nome
);

if(!novoNome){
return;
}

aluno.nome =
novoNome.trim();

salvar();

renderizarAlunos();

renderizarTabelaFaltas();

renderizarConsolidado();

}

function removerAluno(id){

if(
!confirm(
"Deseja excluir este aluno?"
)
){
return;
}

const turma =
turmaAtual();

turma.alunos =
turma.alunos.filter(
a=>a.id!=id
);

salvar();

renderizarAlunos();

renderizarTabelaFaltas();

renderizarConsolidado();

}


function importarTxt(){

const turma =
turmaAtual();

if(!turma){

alert(
"Cadastre uma turma primeiro."
);

return;

}

const arquivo =
document
.getElementById(
"arquivoTxt"
)
.files[0];

if(!arquivo){

alert(
"Selecione um TXT."
);

return;

}

const leitor =
new FileReader();

leitor.onload =
function(e){

const linhas =

e.target.result

.split(/\r?\n/)

.map(
x=>x.trim()
)

.filter(
x=>x
);

linhas.forEach(
nome=>{

turma.alunos.push({

id:
Date.now()
+
Math.random(),

nome:nome,

faltas:{}

});

});

salvar();

renderizarAlunos();

};

leitor.readAsText(
arquivo
);

}

function criarTrimestre(){

const nome =

document
.getElementById(
"nomeTrimestre"
)
.value
.trim();

const meses =

document
.getElementById(
"mesesTrimestre"
)
.value

.split(",")

.map(
m=>m.trim()
)

.filter(
m=>m
);

if(
!nome
||
meses.length===0
){
return;
}

dados.trimestres.push({

id:Date.now(),

nome:nome,

meses:meses

});

salvar();

document
.getElementById(
"nomeTrimestre"
)
.value="";

document
.getElementById(
"mesesTrimestre"
)
.value="";

renderizarTrimestres();

}

function renderizarTrimestres(){

const lista =
document.getElementById(
"listaTrimestres"
);

lista.innerHTML="";

dados.trimestres.forEach(
trimestre=>{

lista.innerHTML+=`

<div class="student-item">

<div>

<strong>

${trimestre.nome}

</strong>

<br>

<span class="small">

${trimestre.meses.join(", ")}

</span>

</div>

<div>

<button
class="btn-primary"
onclick="editarTrimestre(${trimestre.id})">

Editar

</button>

<button
class="btn-danger"
onclick="removerTrimestre(${trimestre.id})">

Excluir

</button>

</div>

</div>

`;

});

atualizarSelectsTrimestres();

}

function editarTrimestre(id){

const trimestre =
dados.trimestres.find(
t=>t.id===id
);

if(!trimestre){
return;
}

const novoNome =
prompt(
"Nome do trimestre:",
trimestre.nome
);

if(novoNome){

trimestre.nome =
novoNome.trim();

}

const novosMeses =
prompt(
"Meses separados por vírgula:",
trimestre.meses.join(", ")
);

if(novosMeses){

trimestre.meses =
novosMeses

.split(",")

.map(
m=>m.trim()
)

.filter(
m=>m
);

}

salvar();

renderizarTrimestres();

renderizarTabelaFaltas();

renderizarConsolidado();

}

function removerTrimestre(id){

if(
!confirm(
"Deseja excluir o trimestre?"
)
){
return;
}

dados.trimestres =
dados.trimestres.filter(
t=>t.id!==id
);

salvar();

renderizarTrimestres();

renderizarTabelaFaltas();

renderizarConsolidado();

}


function atualizarSelectsTrimestres(){

const selectFaltas =
document.getElementById(
"selectTrimestreFaltas"
);

const selectConsolidado =
document.getElementById(
"selectTrimestreConsolidado"
);

selectFaltas.innerHTML="";
selectConsolidado.innerHTML="";

dados.trimestres.forEach(
trimestre=>{

const option1 =
document.createElement(
"option"
);

option1.value=
trimestre.id;

option1.textContent=
trimestre.nome;

selectFaltas.appendChild(
option1
);

const option2 =
document.createElement(
"option"
);

option2.value=
trimestre.id;

option2.textContent=
trimestre.nome;

selectConsolidado
.appendChild(
option2
);

});

}

function trimestreAtualFaltas(){

const id =
Number(
document
.getElementById(
"selectTrimestreFaltas"
)
.value
);

return dados.trimestres.find(
t=>t.id===id
);

}

function trimestreAtualConsolidado(){

const id =
Number(
document
.getElementById(
"selectTrimestreConsolidado"
)
.value
);

return dados.trimestres.find(
t=>t.id===id
);

}

function atualizarFalta(
alunoId,
trimestreNome,
mes,
valor
){

const turma =
turmaAtual();

if(!turma){
return;
}

const aluno =
turma.alunos.find(
a=>a.id==alunoId
);

if(!aluno){
return;
}

if(
!aluno.faltas
){
aluno.faltas={};
}

if(
!aluno.faltas[
trimestreNome
]
){

aluno.faltas[
trimestreNome
]={};

}

aluno.faltas[
trimestreNome
][mes]
=
Number(valor)||0;

salvar();

renderizarConsolidado();

}

function renderizarTabelaFaltas(){

const turma =
turmaAtual();

const trimestre =
trimestreAtualFaltas();

const area =
document.getElementById(
"areaFaltas"
);

if(
!turma
||
!trimestre
){

area.innerHTML="";

return;

}

let html="";

html+=`
<div class="card">
<table>
<tr>
<th>Aluno</th>
`;

trimestre.meses.forEach(
mes=>{

html+=`
<th>
${mes}
</th>
`;

});

html+=`
</tr>
`;

turma.alunos.forEach(
aluno=>{

html+=`
<tr>

<td>

${aluno.nome}

</td>
`;

trimestre.meses.forEach(
mes=>{

const valor =

aluno.faltas?.[
trimestre.nome
]?.[
mes
] || 0;

html+=`

<td>

<input

type="number"

min="0"

value="${valor}"

onchange="atualizarFalta(

'${aluno.id}',

'${trimestre.nome}',

'${mes}',

this.value

)"

>

</td>

`;

});

html+=`
</tr>
`;

});

html+=`
</table>
</div>
`;

area.innerHTML =
html;

}

function renderizarConsolidado(){

const turma =
turmaAtual();

const trimestre =
trimestreAtualConsolidado();

const area =
document.getElementById(
"tabelaConsolidado"
);

if(
!turma
||
!trimestre
){

area.innerHTML="";

return;

}

let html="";

html+=`
<div class="card">
<table>
<tr>

<th>Aluno</th>
`;

trimestre.meses.forEach(
mes=>{

html+=`
<th>
${mes}
</th>
`;

});

html+=`
<th>Total</th>
</tr>
`;

turma.alunos.forEach(
aluno=>{

let totalAluno=0;

html+=`
<tr>

<td>

${aluno.nome}

</td>
`;

trimestre.meses.forEach(
mes=>{

const valor =

aluno.faltas?.[
trimestre.nome
]?.[
mes
] || 0;

totalAluno+=valor;

html+=`
<td>
${valor}
</td>
`;

});

html+=`

<td
style="
font-weight:bold;
background:#f8fafc;
">

${totalAluno}

</td>

`;

html+=`
</tr>
`;

});

html+=`

<tr
style="
background:#dbeafe;
font-weight:bold;
">

<td>

TOTAL DA TURMA

</td>

`;

let totalGeral=0;

trimestre.meses.forEach(
mes=>{

const somaMes =

turma.alunos.reduce(
(acc,aluno)=>{

return acc +

(

aluno.faltas?.[
trimestre.nome
]?.[
mes
]
||
0

);

},
0
);

totalGeral+=somaMes;

html+=`

<td>

${somaMes}

</td>

`;

});

html+=`

<td>

${totalGeral}

</td>

`;

html+=`
</tr>
`;

html+=`
</table>
</div>
`;

area.innerHTML=
html;

}

function exportarBackup(){

const blob =
new Blob(

[
JSON.stringify(
dados,
null,
2
)
],

{
type:
"application/json"
}

);

const link =
document.createElement("a");

link.href=
URL.createObjectURL(
blob
);

link.download=
"backup-frequencia.json";

link.click();

}

function importarBackup(){

const arquivo =

document
.getElementById(
"arquivoBackup"
)
.files[0];

if(!arquivo){

alert(
"Selecione um arquivo JSON."
);

return;

}

const leitor =
new FileReader();

leitor.onload =
function(e){

try{

dados =
JSON.parse(
e.target.result
);

salvar();

renderizarTurmas();

renderizarTrimestres();

renderizarTabelaFaltas();

renderizarConsolidado();

alert(
"Backup restaurado."
);

}
catch{

alert(
"Arquivo inválido."
);

}

};

leitor.readAsText(
arquivo
);

}

document
.getElementById(
"selectTrimestreFaltas"
)
.addEventListener(
"change",
renderizarTabelaFaltas
);

document
.getElementById(
"selectTrimestreConsolidado"
)
.addEventListener(
"change",
renderizarConsolidado
);

renderizarTurmas();

renderizarTrimestres();

setTimeout(()=>{

renderizarTabelaFaltas();

renderizarConsolidado();

},100);

</script>

</body>
</html>
